# dsh profile 补丁片段 —— 把本插件 host 半边插进 profile 的插件树。
#
# 本片段是一个 YAML 列表；由 dsh-ui 的插件管理器拼进
# <DSH_HOME>/profiles/<profile>/cordis.patch.yml 的托管块里。
#
# `insert` 不带 id 时新条目直接追加到根条目列表；`name` 是相对 **profile 目录**
# 的路径 —— 管理器把插件包复制到 <profile>/plugins/thinking_loop_guard/ 之后
# 这个相对路径才成立。`name` 只能写纯字符串（patch loader 拿到 `!!js` 表达式
# 对象时 name.startsWith 会直接崩，gitbash 插件踩过）。
#
# 浏览器那半边（lib/client.js）不需要在这里声明：dsh 的 client-modules 会按
# 包清单里的 `dsh.client` 字段自动发现它 —— 见同目录 package.json。
- insert:
    - id: dsh-loop-guard
      name: ./plugins/thinking_loop_guard/loop_guard.mjs
